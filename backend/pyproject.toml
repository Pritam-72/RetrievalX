[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-qa-bot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.32,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "mypy>=1.13,<2.0",
    "numpy>=1.26,<2.3",
    "pgvector>=0.3,<1.0",
    "pymupdf>=1.24,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
    "sentence-transformers>=3.3,<4.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires DATABASE_URL_TEST and a migrated PostgreSQL/pgvector branch",
    "refusal: database-backed refusal contract tests",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]